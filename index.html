<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>WEEK check</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --hour:64px; --left:58px; --daymin:150px;
  --line:#e5e7eb; --text:#1f2937; --muted:#6b7280; --bg:#f7f8fa;
  --today:#eef6ff; --accent:#2563eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px}
.title{font-size:22px;font-weight:800}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer}
button.primary{background:#111827;color:#fff;border-color:#111827}
button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);margin-left:auto}
.error{color:#b91c1c}
.wrap{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}
.calendar{min-width:calc(var(--left) + var(--daymin) * 7)}
.headrow{display:grid;grid-template-columns:var(--left) repeat(7,minmax(var(--daymin),1fr));position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.corner{border-right:1px solid var(--line);height:48px}
.dayhead{height:48px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.dayhead strong{font-size:15px}
.dayhead.today{background:var(--today);color:var(--accent)}
.body{display:grid;grid-template-columns:var(--left) repeat(7,minmax(var(--daymin),1fr))}
.times{background:#fff;border-right:1px solid var(--line)}
.timecell{height:var(--hour);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);text-align:right;padding:5px 7px 0 0}
.daycol{position:relative;background:#fff;border-right:1px solid var(--line);min-height:calc(var(--hour) * 15)}
.daycol.today{background:linear-gradient(to right,rgba(37,99,235,.035),rgba(37,99,235,.035))}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.event{position:absolute;left:5px;right:5px;border-radius:7px;padding:5px 7px;overflow:hidden;background:#dbeafe;border-left:4px solid #2563eb;color:#0f172a;font-size:12px;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.event .time{font-size:10px;color:#475569}
.event .name{font-weight:700;margin-top:2px}
.event .loc{font-size:10px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allday{margin:4px 5px;padding:4px 6px;border-radius:6px;background:#fef3c7;border-left:3px solid #d97706;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:24px;text-align:center;color:var(--muted);background:#fff}
@media(max-width:700px){
  :root{--daymin:145px;--hour:58px}
  header{position:relative}
  .status{width:100%;margin-left:0}
}
</style>
</head>
<body>
<header>
  <div class="title">WEEK check</div>
  <div class="sub">7日間を横並びで見るバーティカル週間カレンダー</div>
  <div class="toolbar">
    <button id="prevBtn">‹</button>
    <button id="todayBtn">今日</button>
    <button id="nextBtn">›</button>
    <button id="connectBtn" class="primary">Google接続</button>
    <button id="refreshBtn">更新</button>
    <span id="status" class="status">Googleカレンダー未接続</span>
  </div>
</header>

<div id="calendarRoot" class="wrap"></div>

<script src="google-config.js"></script>
<script>
"use strict";

const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";

let tokenClient = null;
let gapiInited = false;
let gisInited = false;
let accessToken = null;
let events = [];
let weekBase = startOfWeek(new Date());

const statusEl = document.getElementById("status");
const connectBtn = document.getElementById("connectBtn");
const refreshBtn = document.getElementById("refreshBtn");

function setStatus(text, error=false){
  statusEl.textContent = text;
  statusEl.classList.toggle("error", error);
}

function cfg(name){
  return window[name] || "";
}

function validConfig(){
  return cfg("WEEKCHECK_GOOGLE_CLIENT_ID") &&
         !cfg("WEEKCHECK_GOOGLE_CLIENT_ID").startsWith("YOUR_") &&
         cfg("WEEKCHECK_GOOGLE_API_KEY") &&
         !cfg("WEEKCHECK_GOOGLE_API_KEY").startsWith("YOUR_");
}

function gapiLoaded(){
  if (!window.gapi) { setStatus("Google APIを読み込めませんでした", true); return; }
  gapi.load("client", initializeGapiClient);
}

async function initializeGapiClient(){
  try{
    await gapi.client.init({
      apiKey: cfg("WEEKCHECK_GOOGLE_API_KEY"),
      discoveryDocs: [DISCOVERY_DOC]
    });
    gapiInited = true;
    maybeEnable();
  }catch(e){
    console.error(e);
    setStatus("Google API初期化エラー", true);
  }
}

function gisLoaded(){
  try{
    if (!window.google?.accounts?.oauth2) throw new Error("Google Identity Services unavailable");
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cfg("WEEKCHECK_GOOGLE_CLIENT_ID"),
      scope: SCOPES,
      callback: ""
    });
    gisInited = true;
    maybeEnable();
  }catch(e){
    console.error(e);
    setStatus("Google認証の初期化エラー", true);
  }
}

function maybeEnable(){
  if (!validConfig()){
    connectBtn.disabled = true;
    setStatus("google-config.js の設定が必要です", true);
    return;
  }
  if (gapiInited && gisInited) connectBtn.disabled = false;
}

function handleAuth(){
  if (!tokenClient || !gapiInited || !gisInited){
    setStatus("Google接続の準備中です。少し待ってから再度押してください", true);
    return;
  }
  tokenClient.callback = async (resp)=>{
    if (resp.error !== undefined){
      console.error(resp);
      setStatus("Google接続に失敗しました", true);
      return;
    }
    accessToken = resp.access_token;
    setStatus("Googleカレンダー接続済み");
    await loadEvents();
  };
  tokenClient.requestAccessToken({prompt: accessToken ? "" : "consent"});
}

async function loadEvents(){
  if (!accessToken){
    handleAuth();
    return;
  }
  try{
    const start = new Date(weekBase);
    const end = new Date(weekBase);
    end.setDate(end.getDate()+7);
    // primary だけでなく、Googleアカウントで閲覧できるカレンダーを一覧取得して
    // その週の予定をまとめて取得します。
    const calResponse = await gapi.client.calendar.calendarList.list({
      showDeleted:false,
      showHidden:false,
      maxResults:250
    });
    const calendars = calResponse.result.items || [];

    let allEvents = [];
    for (const cal of calendars){
      if (!cal.id) continue;
      try{
        const response = await gapi.client.calendar.events.list({
          calendarId:cal.id,
          timeMin:start.toISOString(),
          timeMax:end.toISOString(),
          showDeleted:false,
          singleEvents:true,
          orderBy:"startTime",
          maxResults:2500
        });
        const items = response.result.items || [];
        allEvents.push(...items.map(ev=>({
          ...ev,
          _calendarId:cal.id,
          _calendarName:cal.summary || "Googleカレンダー"
        })));
      }catch(err){
        // 閲覧権限などで取得できないカレンダーはスキップします。
        console.warn("Calendar skipped:", cal.summary, err);
      }
    }

    events = allEvents;
    setStatus(`Googleカレンダー接続済み・${events.length}件（${calendars.length}カレンダー）`);
    render();
  }catch(e){
    console.error(e);
    setStatus("予定の取得に失敗しました", true);
  }
}

function startOfWeek(d){
  const x = new Date(d);
  x.setHours(0,0,0,0);
  const day = x.getDay(); // Sun=0
  const diff = day === 0 ? -6 : 1-day; // Monday start
  x.setDate(x.getDate()+diff);
  return x;
}

function fmtDate(d){
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function fmtTime(d){
  return d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false});
}
function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseEventDate(value, allDay){
  if(allDay) return new Date(value+"T00:00:00");
  return new Date(value);
}
function eventForDay(ev, day){
  const allDay = !!ev.start?.date;
  const s = parseEventDate(ev.start?.dateTime || ev.start?.date, allDay);
  const e = parseEventDate(ev.end?.dateTime || ev.end?.date, allDay);
  if(allDay) return {allDay,s,e};
  const ds = new Date(day); ds.setHours(0,0,0,0);
  const de = new Date(ds); de.setDate(de.getDate()+1);
  const clippedS = s < ds ? ds : s;
  const clippedE = e > de ? de : e;
  if(clippedS >= clippedE) return null;
  return {allDay:false,s:clippedS,e:clippedE};
}

function render(){
  const root = document.getElementById("calendarRoot");
  const labels=["月","火","水","木","金","土","日"];
  const now = new Date();
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(weekBase); d.setDate(d.getDate()+i); days.push(d); }

  let html='<div class="calendar">';
  html+='<div class="headrow"><div class="corner"></div>';
  days.forEach((d,i)=>{
    const today=dateKey(d)===dateKey(now);
    html+=`<div class="dayhead ${today?"today":""}"><span>${labels[i]}</span><strong>${fmtDate(d)}</strong></div>`;
  });
  html+='</div>';

  html+='<div class="body"><div class="times">';
  for(let h=0;h<24;h++) html+=`<div class="timecell">${String(h).padStart(2,"0")}:00</div>`;
  html+='</div>';

  days.forEach((day)=>{
    const today=dateKey(day)===dateKey(now);
    html+=`<div class="daycol ${today?"today":""}">`;
    for(let h=0;h<24;h++) html+=`<div class="hline" style="top:${h*64}px"></div>`;

    const dayEvents = events.map(ev=>{
      const info=eventForDay(ev,day);
      return info?{ev,info}:null;
    }).filter(Boolean);

    for(const item of dayEvents){
      const {ev,info}=item;
      if(info.allDay){
        html+=`<div class="allday" title="${escapeHtml(ev.summary||"(無題)")}">${escapeHtml(ev.summary||"(無題)")}</div>`;
        continue;
      }
      const startMinutes=info.s.getHours()*60+info.s.getMinutes();
      const duration=Math.max(20,(info.e-info.s)/60000);
      const top=startMinutes*(64/60);
      const height=Math.max(28,duration*(64/60)-4);
      const time=`${fmtTime(info.s)}–${fmtTime(info.e)}`;
      html+=`<div class="event" style="top:${top}px;height:${height}px" title="${escapeHtml(ev.summary||"(無題)")}">
        <div class="time">${time}</div>
        <div class="name">${escapeHtml(ev.summary||"(無題)")}</div>
        ${ev.location?`<div class="loc">${escapeHtml(ev.location)}</div>`:""}
      </div>`;
    }
    html+='</div>';
  });
  html+='</div></div>';

  if(events.length===0 && !accessToken){
    html+='<div class="empty">「Google接続」を押すと、Googleカレンダーの予定をここに表示します。</div>';
  }
  root.innerHTML=html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("prevBtn").addEventListener("click",()=>{
  weekBase.setDate(weekBase.getDate()-7);
  render();
  if(accessToken) loadEvents();
});
document.getElementById("nextBtn").addEventListener("click",()=>{
  weekBase.setDate(weekBase.getDate()+7);
  render();
  if(accessToken) loadEvents();
});
document.getElementById("todayBtn").addEventListener("click",()=>{
  weekBase=startOfWeek(new Date());
  render();
  if(accessToken) loadEvents();
});
connectBtn.addEventListener("click",handleAuth);
refreshBtn.addEventListener("click",()=>loadEvents());

render();
setStatus("Google APIを読み込み中…");
</script>

<!-- Google公式クイックスタートと同じく、各ライブラリのonloadで初期化 -->
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
